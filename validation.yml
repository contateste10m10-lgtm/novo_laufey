name: SampEn validation battery
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Independent reference and scientific regression tests
        run: node --test tests/*.test.cjs
      - name: Uniform-iid analytical benchmark
        run: node scripts/run-uniform-benchmark.cjs
