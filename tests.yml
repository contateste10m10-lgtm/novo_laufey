name: Scientific core tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run scientific core tests
        run: node --test tests/*.test.js

      - name: Install Playwright for mobile smoke test
        run: npm install --no-save --no-package-lock playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run mobile smoke test at 390px
        run: node tests/mobile-smoke.playwright.cjs
